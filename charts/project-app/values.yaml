
# Default application container configuration
image:
  repository: ghcr.io/doda25-team6/app
  tag: "0.0.97"
  pullPolicy: IfNotPresent

# Canary versions for the application (Istio subsets v1/v2)
# When istio.enabled=true, the chart will deploy both versions and split traffic.
appVersions:
  v1:
    image:
      tag: "0.0.96"
  v2:
    image:
      tag: "0.0.97"

# Number of application replicas
replicaCount: 3

# Kubernetes service configuration
service:
  type: ClusterIP
  port: 8080

# Ingress configuration for external access
ingress:
  enabled: true
  className: "nginx"
  host: "project.local"
  path: "/"
  tls: false

config:
  exampleValue: "placeholder"
  logLevel: "info"

secretValues:
  exampleSecret: "to-replace"

# Persistent storage configuration
persistence:
  enabled: true
  mountPath: "/usr/share/app-data"
  hostPath: "/mnt/shared"       # VirtualBox shared folder for multi-pod access
  # NFS-backed persistent configuration (used when persistence.enabled = true)
  nfs:
    server: "192.168.56.100"
    path: "/srv/nfs/model"
  # PVC settings
  accessMode: ReadWriteMany
  size: "1Gi"
  claimName: ""

# Prometheus Monitoring Configuration
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: "v2.45.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  retention: "1d"
  scrapeInterval: "30s"
  evaluationInterval: "30s"
  persistence:
    enabled: false
    size: "1Gi"
  
# ServiceMonitor Configuration
serviceMonitor:
  enabled: true
  interval: "30s"
  scrapeTimeout: "10s"
  
# Application metrics endpoints configuration
# These would be configured when applications are deployed
metricsEndpoints:
  # Placeholder for application services that expose metrics
  # Format: serviceName, port, path
  # Example:
  # - name: "my-app"
  #   port: 9090
  #   path: "/metrics"
  endpoints:
    - name: "frontend"
      port: 8080
      path: "/metrics"
    - name: "model"
      port: 8081
      path: "/metrics"

# Model service configuration (migrated from static manifests)
modelService:
  enabled: true
  image:
    repository: ghcr.io/doda25-team6/model-service
    tag: "v0.1.3"
    pullPolicy: IfNotPresent
  # Canary versions for the model service (Istio subsets v1/v2)
  # When enabled, the chart can run both versions behind the same Service.
  versions:
    v1:
      image:
        tag: "v0.1.3"
    v2:
      image:
        tag: "v0.1.3"
  replicaCount: 3
  mountPath: "/app/output"
  service:
    port: 8081
    type: ClusterIP

# Istio Service Mesh Configuration
istio:
  enabled: true
  gateway:
    name: istio-gateway
    selector:
      istio: ingressgateway
    servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
      - "*"
  app:
    weights:
      v1: 90
      v2: 10
    # assign once (90/10), then pin the user via a cookie.
    canary:
      cookieName: exp_canary
      ttlSeconds: 3600
      cookiePath: /
    destinationRule:
      host: '{{ include "project-app.fullname" . }}-frontend'
      trafficPolicy:
        loadBalancer:
          consistentHash:
            # Optional: routing to a backend pod stable
            httpHeaderName: cookie
      subsets:
      - name: v1
        labels:
          version: v1
      - name: v2
        labels:
          version: v2
    virtualService:
      name: app-entry-service
      gateways:
      - istio-gateway
      hosts:
      - "*"
  modelService:
    destinationRule:
      host: '{{ include "project-app.fullname" . }}-model'
      subsets:
      - name: v1
        labels:
          version: v1
      - name: v2
        labels:
          version: v2
    virtualService:
      name: model-service-vs
      hosts:
      - '{{ include "project-app.fullname" . }}-model'
      http:
      - match:
        - sourceLabels:
            version: v2
        route:
        - destination:
            host: '{{ include "project-app.fullname" . }}-model'
            subset: v2
      - route:
        - destination:
            host: '{{ include "project-app.fullname" . }}-model'
            subset: v1

# AlertManager email configuration
alertmanager:
  email:
    to: "your-email@gmail.com"      # Alert recipient
    from: "alertmanager@gmail.com"    # Gmail account (also used for SMTP auth)
# Grafana Visualization Configuration
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "10.2.3"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  # Default admin credentials
  adminUser: admin
  adminPassword: admin
  # Persistent storage for Grafana data (dashboard edits, user preferences)
  persistence:
    enabled: false
    size: "1Gi"
    storageClass: ""
