{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Values.istio.modelService.virtualService.name }}
spec:
  hosts:
{{- tpl (toYaml .Values.istio.modelService.virtualService.hosts) . | nindent 2 }}
  http:
{{- tpl (toYaml .Values.istio.modelService.virtualService.http) . | nindent 2 }}
{{- end }}