{{- if .Values.rateLimit.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "project-app.fullname" . }}-ratelimit
  labels:
    app: {{ include "project-app.fullname" . }}
    component: ratelimit
data:
  config.yaml: |
    domain: ratelimit
    descriptors:
      - key: generic_key
        value: "global"
        rate_limit:
          unit: {{ .Values.rateLimit.unit | default "minute" }}
          requests_per_unit: {{ .Values.rateLimit.limits.default.requestsPerUnit | default 100 }}
      - key: PATH
        value: "/sms"
        rate_limit:
          unit: {{ .Values.rateLimit.unit | default "minute" }}
          requests_per_unit: {{ .Values.rateLimit.limits.sms.requestsPerUnit | default 6 }}
{{- end }}
