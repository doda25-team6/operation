{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "project-app.fullname" . }}-monitoring
  labels:
    {{- include "project-app.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: grafana.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ include "project-app.fullname" . }}-grafana
              port:
                number: 3000
    - host: prometheus.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ include "project-app.fullname" . }}-prometheus
              port:
                number: 9090
    - host: alertmanager.local
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ include "project-app.fullname" . }}-alertmanager
              port:
                number: 9093
{{- end }}
