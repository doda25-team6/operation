{{- if .Values.rateLimit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "project-app.fullname" . }}-ratelimit-redis
  labels:
    app: {{ include "project-app.fullname" . }}
    component: ratelimit-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "project-app.fullname" . }}
      component: ratelimit-redis
  template:
    metadata:
      labels:
        app: {{ include "project-app.fullname" . }}
        component: ratelimit-redis
    spec:
      containers:
      - image: docker.io/redis:alpine
        imagePullPolicy: IfNotPresent
        name: redis
        ports:
        - name: redis
          containerPort: 6379
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "project-app.fullname" . }}-ratelimit-redis
  labels:
    app: {{ include "project-app.fullname" . }}
    component: ratelimit-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
    - name: http-port
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc-port
      port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app: {{ include "project-app.fullname" . }}
    component: ratelimit-redis
{{- end }}

