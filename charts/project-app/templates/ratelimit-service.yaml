{{- if .Values.rateLimit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "project-app.fullname" . }}-ratelimit
  labels:
    app: {{ include "project-app.fullname" . }}
    component: ratelimit
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: {{ include "project-app.fullname" . }}
    component: ratelimit
{{- end }}

