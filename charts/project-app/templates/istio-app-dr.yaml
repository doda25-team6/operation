{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: app-dr
spec:
  host: {{ include "project-app.fullname" . }}-frontend
  trafficPolicy:
{{- tpl (toYaml .Values.istio.app.destinationRule.trafficPolicy) . | nindent 4 }}
  subsets:
  {{- toYaml .Values.istio.app.destinationRule.subsets | nindent 2 }}
{{- end }}