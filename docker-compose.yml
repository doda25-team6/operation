services:

  model-service:
    build: 
      context: ../model-service
      dockerfile: Dockerfile
      args:
        GITHUB_USERNAME: ${GITHUB_USERNAME}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: model-service
    expose:
      - "${SERVER_PORT:-8081}"
    environment:
      SERVER_PORT: "${SERVER_PORT:-8081}"
      MODEL_DIR: /app/output
      MODEL_URL: "https://github.com/doda25-team6/model-service/releases/download/v0.1.3/model-v0.1.3.joblib"
      PREPROCESSOR_URL: "https://github.com/doda25-team6/model-service/releases/download/v0.1.3/preprocessor-v0.1.3.joblib"

    # Without this, the model-service would always download 
    # since output would be empty.
    volumes:
      - ../model-service/output:/app/output


  app:
    build:
      context: ../app
      dockerfile: Dockerfile
      args:
        # F2: GitHub Package Registry authentication for lib-version
        GITHUB_USERNAME: ${GITHUB_USERNAME}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: app
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      - model-service
    environment:
      MODEL_HOST: "${MODEL_HOST:-http://model-service:8081}"
    
